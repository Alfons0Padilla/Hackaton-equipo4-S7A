<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Administración de trabajadores y horarios">
  <title>CodeShieldQA | Administración</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #65708a;
      --line: #e5e9f2;
      --surface: #ffffff;
      --background: #f5f7fb;
      --primary: #3659d9;
      --primary-dark: #2845b5;
      --success: #16835d;
      --danger: #c33b4b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--background); }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app-shell { display: flex; min-height: 100vh; }
    
    .sidebar { width: 248px; padding: 28px 18px; color: #fff; background: #18234a; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 12px 42px; font-size: 1.1rem; font-weight: 800; }
    .brand-mark { display: grid; width: 32px; height: 32px; place-items: center; color: #18234a; background: #8de7cf; border-radius: 9px; font-weight: 900; }
    .nav-label { margin: 0 12px 10px; color: #9da9d1; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 5px; border-radius: 9px; color: #d3daf2; }
    .nav-link.active, .nav-link:hover { color: #fff; background: #2b3a73; }
    .nav-icon { width: 20px; text-align: center; }
    .sidebar-footer { margin-top: auto; padding: 18px 12px 0; color: #9da9d1; font-size: .8rem; }
    
    .main { flex: 1; min-width: 0; padding: 34px clamp(22px, 5vw, 64px); }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 30px; }
    .eyebrow { margin: 0 0 6px; color: var(--primary); font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.7rem, 3vw, 2.3rem); }
    .date { color: var(--muted); font-size: .9rem; }
    
    .admin-layout { display: grid; grid-template-columns: 320px 120px 1fr; gap: 20px; align-items: start; margin-top: 20px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 30px rgba(30, 45, 80, .04); padding: 22px; }
    
    .list-section { display: flex; flex-direction: column; gap: 15px; height: 750px; }
    .search-bar { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--background); }
    .employee-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; border: 1px solid var(--line); border-radius: 8px; }
    .employee-list li { padding: 14px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
    .employee-list li:last-child { border-bottom: none; }
    .employee-list li:hover { background: var(--background); }
    .employee-list li.active { background: #eaf0ff; color: var(--primary-dark); font-weight: 700; border-left: 4px solid var(--primary); }
    
    .action-column { display: flex; flex-direction: column; gap: 15px; padding-top: 60px; }
    .btn-action { padding: 12px; border: 0; border-radius: 8px; font-weight: 700; color: #fff; text-align: center; transition: opacity 0.2s; }
    .btn-action:hover { opacity: 0.85; }
    .btn-delete { background: var(--danger); }
    .btn-edit { background: var(--primary); }
    .btn-add { background: var(--success); }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field.full { grid-column: 1 / -1; }
    label { color: var(--muted); font-size: .78rem; font-weight: 700; text-transform: uppercase; }
    
    input:not([type="checkbox"]), select { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--background); }
    input:focus, select:focus { outline: 2px solid var(--primary); background: #fff; }
    
    /* Clase para campos manejados por el sistema (Base de datos) */
    .readonly-input { background: #e2e6f0 !important; color: var(--muted) !important; cursor: not-allowed; font-weight: 700; }
    .label-hint { font-size: 0.65rem; text-transform: none; font-weight: normal; margin-left: 4px; color: var(--primary); }

    .weekly-schedule { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
    .schedule-header { display: grid; grid-template-columns: 60px 1fr 1fr 1fr 1fr; gap: 5px; padding: 12px 8px; background: var(--background); border-bottom: 1px solid var(--line); font-size: 0.65rem; font-weight: 800; color: var(--muted); text-transform: uppercase; text-align: center; }
    .schedule-row { display: grid; grid-template-columns: 60px 1fr 1fr 1fr 1fr; gap: 8px; padding: 8px; border-bottom: 1px solid var(--line); align-items: center; }
    .schedule-row:last-child { border-bottom: none; }
    .schedule-row input[type="time"] { padding: 6px; font-size: 0.8rem; text-align: center; }
    .day-name { font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 4px; color: var(--ink); }
    
    .qr-section { margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--line); display: flex; align-items: flex-start; gap: 20px; }
    .qr-box { width: 120px; height: 120px; border: 2px solid var(--line); border-radius: 12px; display: grid; place-items: center; background: #fff; font-size: 0.8rem; color: var(--muted); font-weight: bold; }
    .qr-actions { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
    .button-secondary { padding: 10px 15px; border: 1px solid var(--line); border-radius: 8px; font-weight: 700; color: var(--ink); background: #edf0f7; }
    .button-secondary:hover { background: #e2e6f0; }

    @media (max-width: 1100px) {
      .admin-layout { grid-template-columns: 250px 1fr; }
      .action-column { grid-column: 1 / -1; flex-direction: row; padding-top: 0; justify-content: flex-end; }
    }
    @media (max-width: 900px) {
      .sidebar { width: 72px; padding: 20px 10px; }
      .brand { justify-content: center; margin: 0 0 34px; }
      .brand-text, .nav-label, .nav-link span:not(.nav-icon), .sidebar-footer { display: none; }
      .nav-link { justify-content: center; }
      .main { padding: 26px 18px; }
      .schedule-header, .schedule-row { grid-template-columns: 1fr; gap: 2px; }
      .schedule-row { padding-bottom: 15px; }
      .day-name { margin-bottom: 5px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#"><span class="brand-mark">C</span><span class="brand-text">CodeShieldQA</span></a>
      <p class="nav-label">Panel</p>
      <nav aria-label="Navegación principal">
        <a class="nav-link" href="#"><span class="nav-icon">▣</span><span>Asistencia</span></a>
        <a class="nav-link active" href="#"><span class="nav-icon">⚙</span><span>Administración</span></a>
      </nav>
      <p class="sidebar-footer">Acceso administrativo<br>v0.4 · Frontend</p>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">Área restringida</p>
          <h1>Administración</h1>
        </div>
        <time class="date" id="current-date"></time>
      </header>

      <div class="admin-layout">
        <section class="card list-section">
          <input type="search" class="search-bar" placeholder="Buscar empleado...">
          <ul class="employee-list">
            <li class="active">Ana López</li>
            <li>Juan Pérez</li>
            <li>María Ruiz</li>
            <li>Pedro Díaz</li>
          </ul>
        </section>

        <div class="action-column">
          <button class="btn-action btn-delete">Eliminar</button>
          <button class="btn-action btn-edit">Editar</button>
          <button class="btn-action btn-add">Agregar</button>
        </div>

        <section class="card">
          <form class="form-grid" id="employee-form">
            <div class="form-field full">
              <label>Nombre</label>
              <input type="text" value="Ana" disabled>
            </div>
            <div class="form-field">
              <label>Apellido PA</label>
              <input type="text" value="López" disabled>
            </div>
            <div class="form-field">
              <label>Apellido MA</label>
              <input type="text" value="García" disabled>
            </div>
            
            <!-- Campo de Número de Empleado (Solo lectura) -->
            <div class="form-field">
              <label>Num empleado <span class="label-hint">(Autogenerado)</span></label>
              <input type="text" class="readonly-input" value="15" disabled readonly>
            </div>
            
            <div class="form-field">
              <label>Correo</label>
              <input type="email" value="ana.lopez@empresa.mx" disabled>
            </div>

            <div class="form-field full">
              <label>Configuración de Horarios (Jornadas)</label>
              <div class="weekly-schedule">
                <div class="schedule-header">
                  <span>Día</span>
                  <span>Entrada 1</span>
                  <span>Salida 1</span>
                  <span>Entrada 2</span>
                  <span>Salida 2</span>
                </div>
                
                <div class="schedule-row">
                  <span class="day-name"><input type="checkbox" checked disabled> Lun</span>
                  <input type="time" value="08:00" disabled>
                  <input type="time" value="16:00" disabled>
                  <input type="time" disabled>
                  <input type="time" disabled>
                </div>
                
                <div class="schedule-row">
                  <span class="day-name"><input type="checkbox" checked disabled> Mar</span>
                  <input type="time" value="08:00" disabled>
                  <input type="time" value="16:00" disabled>
                  <input type="time" disabled>
                  <input type="time" disabled>
                </div>
                
                <div class="schedule-row">
                  <span class="day-name"><input type="checkbox" checked disabled> Mié</span>
                  <input type="time" value="08:00" disabled>
                  <input type="time" value="13:00" disabled>
                  <input type="time" value="17:00" disabled>
                  <input type="time" value="20:00" disabled>
                </div>
                
                <div class="schedule-row">
                  <span class="day-name"><input type="checkbox" checked disabled> Jue</span>
                  <input type="time" value="09:00" disabled>
                  <input type="time" value="17:00" disabled>
                  <input type="time" disabled>
                  <input type="time" disabled>
                </div>
                
                <div class="schedule-row">
                  <span class="day-name"><input type="checkbox" checked disabled> Vie</span>
                  <input type="time" value="08:00" disabled>
                  <input type="time" value="15:00" disabled>
                  <input type="time" disabled>
                  <input type="time" disabled>
                </div>
                
                <div class="schedule-row">
                  <span class="day-name"><input type="checkbox" disabled> Sáb</span>
                  <input type="time" disabled>
                  <input type="time" disabled>
                  <input type="time" disabled>
                  <input type="time" disabled>
                </div>

                <div class="schedule-row">
                  <span class="day-name"><input type="checkbox" disabled> Dom</span>
                  <input type="time" disabled>
                  <input type="time" disabled>
                  <input type="time" disabled>
                  <input type="time" disabled>
                </div>
              </div>
            </div>
          </form>

          <div class="qr-section">
            <div class="qr-box">[ IMG QR ]</div>
            <div class="qr-actions">
              <label>Código de Acceso</label>
              <button type="button" class="button-secondary">Generar nuevo QR</button>
              <button type="button" class="button-secondary">Imprimir Gafete</button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    document.querySelector("#current-date").textContent = new Intl.DateTimeFormat("es-MX", {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    }).format(new Date());

    const editBtn = document.querySelector('.btn-edit');
    // Excluir específicamente los campos que tengan la clase .readonly-input
    const inputs = document.querySelectorAll('#employee-form input:not(.readonly-input)');

    editBtn.addEventListener('click', () => {
      inputs.forEach(input => {
        input.disabled = !input.disabled;
        if(input.type !== 'checkbox') {
          input.style.background = input.disabled ? 'var(--background)' : '#ffffff';
        }
      });
      editBtn.textContent = editBtn.textContent === 'Editar' ? 'Guardar' : 'Editar';
      editBtn.style.background = editBtn.textContent === 'Guardar' ? 'var(--success)' : 'var(--primary)';
    });
  </script>
</body>
</html>
